{% extends "base.html" %}

{% block title %}
My Profile - E-Learning
{% endblock %}

{% block content %}

<h1>My Profile</h1>

<h2>Profile Information</h2>

<p>
    <strong>Name:</strong>
    {{ user.first_name }} {{ user.last_name }}
</p>

<p>
    <strong>Email:</strong>
    {{ user.email }}
</p>

<p>
    <strong>Username:</strong>
    {{ user.username }}
</p>

<a href="{% url 'edit_profile' %}">
    <button type="button">Edit Profile</button>
</a>

{% endblock %}
