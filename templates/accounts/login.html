{% extends "base.html" %}

{% load socialaccount %}

{% block title %}
Login - E-Learning
{% endblock %}

{% block content %}

<h1>Login</h1>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Login</button>

</form>

<hr>

<a href="{% provider_login_url 'google' %}">
    <button type="button">
        Continue with Google
    </button>
</a>

<p>
    Don't have an account?
    <a href="{% url 'signup' %}">Signup</a>
</p>

{% endblock %}
