{% extends "base.html" %}

{% block title %}
Verify Reset OTP - E-Learning
{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">

        <div class="auth-card__head">
            <div class="auth-card__icon">📧</div>
            <h1>Verify OTP</h1>
            <p class="auth-card__sub">
                We have sent a 6-digit OTP to your email.
            </p>
        </div>

        {% if error %}
            <p class="auth-card__error">
                {{ error }}
            </p>
        {% endif %}

        <form method="post" novalidate>

            {% csrf_token %}

            <input
                type="text"
                name="otp"
                maxlength="6"
                minlength="6"
                pattern="\d{6}"
                placeholder="Enter 6-digit OTP"
                class="auth-input"
                required
            >

            <button type="submit" class="btn btn--primary btn--block">
                Verify OTP
            </button>

        </form>

        <p class="auth-card__footer">
            <a href="{% url 'forgot_password' %}">Request a new OTP</a>
        </p>

    </div>
</section>

{% endblock %}
