<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#efefef;font-family:Inter,Arial,Helvetica,sans-serif;">
  <div style="max-width:600px;margin:0 auto;background:#ffffff;border:1px solid #e2e2e2;border-radius:16px;overflow:hidden;">
    <div style="background:#000000;color:#ffffff;padding:24px 32px;">
      <h1 style="margin:0;font-size:20px;">📬 New Contact Message</h1>
    </div>
    <div style="padding:32px;">
      <table style="width:100%;border-collapse:collapse;font-size:15px;color:#000;">
        <tr>
          <td style="padding:10px 12px;background:#efefef;font-weight:600;border-radius:8px 0 0 0;">Name</td>
          <td style="padding:10px 12px;background:#efefef;border-radius:0 8px 0 0;">{{ message.name }}</td>
        </tr>
        <tr>
          <td style="padding:10px 12px;border-bottom:1px solid #e2e2e2;font-weight:600;">Email</td>
          <td style="padding:10px 12px;border-bottom:1px solid #e2e2e2;">{{ message.email }}</td>
        </tr>
        <tr>
          <td style="padding:10px 12px;border-bottom:1px solid #e2e2e2;font-weight:600;">Subject</td>
          <td style="padding:10px 12px;border-bottom:1px solid #e2e2e2;">{{ message.subject }}</td>
        </tr>
        <tr>
          <td style="padding:10px 12px;border-bottom:1px solid #e2e2e2;font-weight:600;">Received</td>
          <td style="padding:10px 12px;border-bottom:1px solid #e2e2e2;">{{ message.created_at|date:"F j, Y \a\t g:i A" }}</td>
        </tr>
        <tr>
          <td style="padding:10px 12px;font-weight:600;vertical-align:top;">Message</td>
          <td style="padding:10px 12px;white-space:pre-line;">{{ message.message }}</td>
        </tr>
      </table>
    </div>
    <div style="background:#efefef;padding:16px 32px;color:#afafaf;font-size:12px;">
      &copy; E-Learning Platform. Contact form notification.
    </div>
  </div>
</body>
</html>
